<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Праздники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05030b; --violet:#9b5cf6; --violet2:#6d28d9; --pink:#c084fc;
  --card:rgba(255,255,255,0.045); --border:rgba(155,92,246,0.25);
  --text:#f4f1ff; --sub:#b7a9e6;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Poppins', system-ui, sans-serif;
  background:
    radial-gradient(700px 500px at 10% 0%, rgba(155,92,246,0.3), transparent 60%),
    radial-gradient(600px 500px at 100% 15%, rgba(109,40,217,0.35), transparent 60%),
    radial-gradient(500px 400px at 50% 100%, rgba(192,132,252,0.15), transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100%;
  overflow-x:hidden;
  position:relative;
}
canvas#sparkle{position:fixed; inset:0; z-index:0; pointer-events:none;}
svg.ic{width:1em; height:1em; vertical-align:-0.15em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
svg.glyph{display:block;}

/* ---------- splash ---------- */
#splash{
  position:fixed; inset:0; z-index:50; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  transition:opacity .7s ease, visibility .7s ease;
}
#splash .crownwrap{width:58px; height:58px; color:#c084fc; filter:drop-shadow(0 0 18px rgba(155,92,246,0.9)); animation:floatCrown 2.2s ease-in-out infinite;}
#splash .ring{
  width:64px; height:64px; border-radius:50%; border:3px solid rgba(155,92,246,0.25);
  border-top-color:#c084fc; animation:spin 1s linear infinite;
}
#splash p{color:var(--sub); font-size:12.5px; letter-spacing:1.5px;}
@keyframes floatCrown{0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-7px) rotate(3deg);}}
@keyframes spin{to{transform:rotate(360deg);}}
#splash.hide{opacity:0; visibility:hidden;}

.reveal{opacity:0; transform:translateY(22px); transition:opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1);}
.reveal.show{opacity:1; transform:translateY(0);}

.wrap{position:relative; z-index:1; max-width:460px; margin:0 auto; padding:20px 18px 110px;}

/* ---------- header ---------- */
.header-top{display:flex; align-items:center; justify-content:space-between;}
.logo{display:flex; align-items:center; gap:8px; color:#d8c4ff; font-weight:700; font-size:14px; letter-spacing:0.5px;}
.logo .icw{width:22px; height:22px; color:#c084fc; filter:drop-shadow(0 0 8px rgba(192,132,252,0.8));}
.iconbtn{
  width:44px; height:44px; border-radius:15px;
  background:rgba(255,255,255,0.05); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:19px; color:#e6ddff;
  box-shadow:0 0 14px rgba(155,92,246,0.3); cursor:pointer; transition:transform .2s ease;
}
.iconbtn svg{width:19px; height:19px;}
.iconbtn:hover{transform:translateY(-2px);}
.iconbtn.gear:hover{transform:rotate(60deg);}

.profile-row{display:flex; align-items:center; gap:14px; margin-top:22px;}
.avatar{
  width:68px; height:68px; border-radius:50%; position:relative; flex-shrink:0;
  background:
    radial-gradient(circle at 35% 30%, rgba(216,196,255,0.35), transparent 55%),
    linear-gradient(150deg,#3a2168,#140a28);
  border:2px solid rgba(192,132,252,0.55);
  box-shadow:0 0 20px rgba(155,92,246,0.55), inset 0 0 16px rgba(192,132,252,0.25);
  display:flex; align-items:center; justify-content:center;
}
.avatar svg{width:30px; height:30px; color:#e6ddff;}
.avatar .dot{position:absolute; bottom:1px; right:1px; width:13px; height:13px; border-radius:50%;
  background:#34d399; border:2px solid var(--bg); box-shadow:0 0 8px #34d399;}
.who{flex:1; min-width:0;}
.who .namerow{display:flex; align-items:center; gap:7px;}
.who h2{font-size:20px; font-weight:700;}
.who .diamond{width:14px; height:14px; color:#c084fc;}
.who .editp{width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,0.06);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:#b7a9e6;}
.who .editp svg{width:13px; height:13px;}

.status-row{display:flex; align-items:center; justify-content:space-between; margin-top:18px;}
.pill{
  display:flex; align-items:center; gap:8px; background:rgba(52,211,153,0.1);
  border:1px solid rgba(52,211,153,0.35); color:#86efac; padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600;
}
.pill i{width:7px; height:7px; border-radius:50%; background:#34d399; box-shadow:0 0 6px #34d399; display:block;}

/* ---------- cards ---------- */
.cards{display:flex; gap:12px; margin-top:26px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none;}
.cards::-webkit-scrollbar{display:none;}
.card{
  flex:0 0 152px; border-radius:20px; overflow:hidden; position:relative;
  border:1px solid var(--border); background:var(--card); display:flex; flex-direction:column;
}
.card .top{height:118px; position:relative; display:flex; align-items:center; justify-content:center;}
.card.c1 .top{background:radial-gradient(circle at 50% 35%, rgba(255,130,40,0.4), transparent 65%), linear-gradient(160deg,#1a0f2e,#0c0616);}
.card.c2 .top{background:radial-gradient(circle at 50% 35%, rgba(109,40,217,0.45), transparent 65%), linear-gradient(160deg,#141033,#0c0616);}
.card.c3 .top{background:radial-gradient(circle at 50% 35%, rgba(236,72,153,0.35), transparent 65%), linear-gradient(160deg,#20102e,#0c0616);}
.card .top svg{width:56px; height:56px;}
.card.c1 .top svg{color:#ff9d4d; filter:drop-shadow(0 0 14px rgba(255,140,40,0.7));}
.card.c2 .top svg{color:#b89bff; filter:drop-shadow(0 0 14px rgba(155,92,246,0.7));}
.card.c3 .top svg{color:#ff8fc4; filter:drop-shadow(0 0 14px rgba(236,72,153,0.7));}
.card .info{padding:12px; display:flex; flex-direction:column; gap:3px; flex:1;}
.card .info h3{font-size:15px; font-weight:700;}
.card .info .d{display:flex; align-items:center; gap:5px; color:var(--sub); font-size:11.5px;}
.card .info .d svg{width:11px; height:11px;}
.card .info .left{color:#c9b8ff; font-size:11px; font-weight:600;}
.arrow{
  margin-top:8px; width:100%; border:none; border-radius:11px; padding:9px 0;
  background:linear-gradient(90deg,#9b5cf6,#6d28d9); color:#fff; display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 0 14px rgba(155,92,246,0.5); transition:transform .15s ease, box-shadow .2s ease;
}
.arrow svg{width:15px; height:15px;}
.arrow:hover{transform:translateY(-1px); box-shadow:0 0 20px rgba(155,92,246,0.8);}
.arrow:active{transform:translateY(0);}

/* ---------- sections ---------- */
.section{
  margin-top:20px; border-radius:20px; padding:18px; background:var(--card); border:1px solid var(--border);
  position:relative; overflow:hidden;
}
.section .glow{position:absolute; width:140px; height:140px; border-radius:50%; filter:blur(50px); opacity:0.3; z-index:0;}
.section.holidays .glow{background:#9b5cf6; top:-40px; right:-30px;}
.section.notes .glow{background:#c084fc; bottom:-40px; left:-30px;}
.s-head{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
.s-head .l{display:flex; align-items:center; gap:10px;}
.s-head .ic{
  width:38px; height:38px; border-radius:12px; background:rgba(155,92,246,0.15); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; color:#d8c4ff;
}
.s-head .ic svg{width:18px; height:18px;}
.s-head h4{font-size:16px; font-weight:700;}
.s-head a{color:#c9b8ff; font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; display:flex; align-items:center; gap:4px;}
.s-head a svg{width:13px; height:13px;}
.hlist{list-style:none; margin-top:14px; position:relative; z-index:1;}
.hlist li{display:flex; align-items:center; gap:10px; padding:8px 0; font-size:14px; color:var(--text);}
.hlist li b{width:7px; height:7px; border-radius:50%; background:#c084fc; box-shadow:0 0 6px #c084fc; flex-shrink:0; display:block;}
.hlist li span{color:var(--sub); margin-left:auto; font-size:12.5px; white-space:nowrap;}

textarea#noteBox{
  width:100%; margin-top:14px; min-height:70px; resize:vertical; position:relative; z-index:1;
  background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:14px; color:var(--text);
  font-family:inherit; font-size:13.5px; padding:12px; outline:none;
}
textarea#noteBox:focus{border-color:#c084fc; box-shadow:0 0 14px rgba(192,132,252,0.35);}
.save-hint{font-size:11px; color:var(--sub); margin-top:6px; position:relative; z-index:1;}

/* ---------- bottom nav ---------- */
nav.bottom{
  position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10;
  width:min(92%,420px); display:flex; justify-content:space-around; align-items:center;
  background:rgba(12,6,22,0.88); backdrop-filter:blur(10px);
  border:1px solid var(--border); border-radius:22px; padding:10px 4px;
  box-shadow:0 0 26px rgba(155,92,246,0.3);
}
nav.bottom button{
  background:none; border:none; color:var(--sub); cursor:pointer;
  width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  transition:background .2s ease, color .2s ease, box-shadow .2s ease;
}
nav.bottom button svg{width:20px; height:20px;}
nav.bottom button.active{color:#fff; background:rgba(155,92,246,0.25); box-shadow:0 0 14px rgba(155,92,246,0.6);}

.toast{
  position:fixed; left:50%; bottom:92px; transform:translate(-50%,16px); z-index:20;
  background:rgba(20,10,35,0.92); border:1px solid rgba(155,92,246,0.5); color:var(--text);
  padding:11px 18px; border-radius:14px; font-size:13.5px; opacity:0; pointer-events:none;
  box-shadow:0 0 20px rgba(155,92,246,0.4); transition:opacity .3s ease, transform .3s ease;
}
.toast.show{opacity:1; transform:translate(-50%,0);}
</style>
</head>
<body>

<!-- ============ SVG ICON LIBRARY (custom-drawn, no stickers) ============ -->
<svg width="0" height="0" style="position:absolute">
<defs>
<symbol id="i-crown" viewBox="0 0 24 24"><path class="ic" d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z" vector-effect="non-scaling-stroke"/></symbol>

<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h5v-5h2v5h5V10"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.5 6.2 6.5.5-5 4.3 1.6 6.3L12 17l-5.6 3.3 1.6-6.3-5-4.3 6.5-.5z"/></symbol>

<symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2l1.4 5.6L19 9l-5.6 1.4L12 16l-1.4-5.6L5 9l5.6-1.4z"/></symbol>
</defs>
</svg>

<canvas id="sparkle"></canvas>

<div id="splash">
  <div class="crownwrap"><svg class="glyph" viewBox="0 0 24 24" width="100%" height="100%"><use href="#i-crown"/></svg></div>
  <div class="ring"></div>
  <p>ЗАГРУЗКА МАГИИ...</p>
</div>

<div class="wrap">
  <header class="reveal" id="r0">
    <div class="header-top">
      <div class="logo"><svg class="ic icw"><use href="#i-sparkle"/></svg> ПРАЗДНИКИ</div>
      <div class="iconbtn"><svg class="ic"><use href="#i-bell"/></svg></div>
    </div>

    <div class="profile-row">
      <div class="avatar"><svg class="glyph"><use href="#i-crown"/></svg><span class="dot"></span></div>
      <div class="who">
        <div class="namerow">
          <h2 id="nameDisplay">Имя</h2>
          <svg class="ic diamond"><use href="#i-diamond"/></svg>
          <div class="editp" id="editNameBtn"><svg class="ic"><use href="#i-pencil"/></svg></div>
        </div>
      </div>
    </div>

    <div class="status-row">
      <div class="pill"><i></i> Онлайн</div>
      <div class="iconbtn gear"><svg class="ic"><use href="#i-gear"/></svg></div>
    </div>
  </header>

  <div class="cards">
    <div class="card c1 reveal" id="r1">
      <div class="top"><svg class="glyph"><use href="#i-pumpkin"/></svg></div>
      <div class="info">
        <h3>Хэллоуин</h3>
        <div class="d"><svg class="ic"><use href="#i-calendar"/></svg> 31 октября</div>
        <div class="left" id="leftHalloween">—</div>
        <button class="arrow" data-target="holidaysSection"><svg class="ic"><use href="#i-arrow"/></svg></button>
      </div>
    </div>
    <div class="card c2 reveal" id="r2">
      <div class="top"><svg class="glyph"><use href="#i-tree"/></svg></div>
      <div class="info">
        <h3>Новый год</h3>
        <div class="d"><svg class="ic"><use href="#i-calendar"/></svg> 1 января</div>
        <div class="left" id="leftNY">—</div>
        <button class="arrow" data-target="holidaysSection"><svg class="ic"><use href="#i-arrow"/></svg></button>
      </div>
    </div>
    <div class="card c3 reveal" id="r3">
      <div class="top"><svg class="glyph"><use href="#i-cake"/></svg></div>
      <div class="info">
        <h3>Мой ДР</h3>
        <div class="d"><svg class="ic"><use href="#i-calendar"/></svg> 18 апреля</div>
        <div class="left" id="leftBday">—</div>
        <button class="arrow" data-target="holidaysSection"><svg class="ic"><use href="#i-arrow"/></svg></button>
      </div>
    </div>
  </div>

  <div class="section holidays reveal" id="holidaysSection">
    <div class="glow"></div>
    <div class="s-head">
      <div class="l"><div class="ic"><svg class="ic"><use href="#i-calendar"/></svg></div><h4>Праздники</h4></div>
      <a>Все <svg class="ic"><use href="#i-arrow"/></svg></a>
    </div>
    <ul class="hlist">
      <li><b></b> Хэллоуин — 31 октября <span id="dHalloween"></span></li>
      <li><b></b> Новый год — 1 января <span id="dNY"></span></li>
      <li><b></b> Мой день рождения — 18 апреля <span id="dBday"></span></li>
    </ul>
  </div>

  <div class="section notes reveal" id="r5">
    <div class="glow"></div>
    <div class="s-head">
      <div class="l"><div class="ic"><svg class="ic"><use href="#i-note"/></svg></div><h4>Заметки</h4></div>
      <a id="clearNote">Очистить</a>
    </div>
    <textarea id="noteBox" placeholder="Не забыть важное..."></textarea>
    <div class="save-hint">Сохраняется автоматически на этом устройстве</div>
  </div>
</div>

<nav class="bottom reveal" id="r6">
  <button class="active" data-nav="home"><svg class="ic"><use href="#i-home"/></svg></button>
  <button data-nav="fav"><svg class="ic"><use href="#i-star"/></svg></button>
  <button data-nav="cal"><svg class="ic"><use href="#i-calendar"/></svg></button>
  <button data-nav="notes"><svg class="ic"><use href="#i-note"/></svg></button>
  <button data-nav="profile"><svg class="ic"><use href="#i-user"/></svg></button>
</nav>
<div class="toast" id="toast"></div>

<script>
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    document.querySelectorAll('.reveal').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('show'), 150 + i*120);
    });
  }, 1100);
});

function nextDate(month, day){
  const now = new Date();
  let y = now.getFullYear();
  let d = new Date(y, month-1, day, 0,0,0,0);
  if(d.getTime() <= now.getTime()){ d = new Date(y+1, month-1, day,0,0,0,0); }
  return d;
}
function daysLeft(d){ return Math.ceil((d - new Date())/86400000); }
function tick(){
  const h = nextDate(10,31), n = nextDate(1,1), b = nextDate(4,18);
  document.getElementById('leftHalloween').textContent = 'через '+daysLeft(h)+' дн.';
  document.getElementById('leftNY').textContent = 'через '+daysLeft(n)+' дн.';
  document.getElementById('leftBday').textContent = 'через '+daysLeft(b)+' дн.';
  document.getElementById('dHalloween').textContent = daysLeft(h)+' дн.';
  document.getElementById('dNY').textContent = daysLeft(n)+' дн.';
  document.getElementById('dBday').textContent = daysLeft(b)+' дн.';
}
tick(); setInterval(tick, 60000);

document.querySelectorAll('.arrow').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.getElementById(btn.dataset.target).scrollIntoView({behavior:'smooth', block:'center'});
  });
});

const navMap = {home:null, fav:'holidaysSection', cal:'holidaysSection', notes:'r5', profile:'r0'};
document.querySelectorAll('nav.bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tgt = navMap[btn.dataset.nav];
    if(tgt) document.getElementById(tgt).scrollIntoView({behavior:'smooth', block:'start'});
    else window.scrollTo({top:0, behavior:'smooth'});
  });
});

document.getElementById('editNameBtn').addEventListener('click', ()=>{
  const cur = localStorage.getItem('userName') || 'Имя';
  const val = prompt('Как тебя называть?', cur);
  if(val){ localStorage.setItem('userName', val); document.getElementById('nameDisplay').textContent = val; }
});
(function(){
  const saved = localStorage.getItem('userName');
  if(saved) document.getElementById('nameDisplay').textContent = saved;
})();

const noteBox = document.getElementById('noteBox');
noteBox.value = localStorage.getItem('userNote') || '';
let saveTimeout;
noteBox.addEventListener('input', ()=>{
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(()=>{
    localStorage.setItem('userNote', noteBox.value);
    showToast('Заметка сохранена');
  }, 500);
});
document.getElementById('clearNote').addEventListener('click', ()=>{
  noteBox.value=''; localStorage.removeItem('userNote'); showToast('Заметка очищена');
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

const canvas = document.getElementById('sparkle');
const ctx = canvas.getContext('2d');
let w,h,sparkles=[];
function resize(){ w=canvas.width=innerWidth; h=canvas.height=innerHeight; }
resize(); addEventListener('resize', resize);
for(let i=0;i<55;i++){
  sparkles.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.6+0.4, vy:Math.random()*0.35+0.08, tw:Math.random()*Math.PI*2});
}
function draw(){
  ctx.clearRect(0,0,w,h);
  sparkles.forEach(s=>{
    s.tw += 0.04;
    const a = 0.25 + Math.abs(Math.sin(s.tw))*0.5;
    ctx.beginPath();
    ctx.fillStyle = '#d8c4ff'; ctx.globalAlpha = a;
    ctx.shadowColor='#9b5cf6'; ctx.shadowBlur=7;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    s.y -= s.vy; if(s.y < -5){ s.y = h+5; s.x = Math.random()*w; }
  });
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
